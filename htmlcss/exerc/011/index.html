<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduzindo audios</title>
</head>
<body>
    <h1>Reproduzindo Audios</h1>
    <p>Vamos aprender a reproduzir audios em HTML5</p>
    <audio src="midia/Radiohead - Creep (Lyrics) - LyricsZone (youtube).mp3" controls autoplay></audio>

    <h1>Reproduzindo Outros Audios</h1>
    <audio preload="metadata" autoplay controls>
        <source src="midia/Radiohead - Creep (Lyrics) - LyricsZone (youtube).mpeg" type="audio/mpeg">
        <source src="midia/Radiohead - Creep (Lyrics) - LyricsZone (youtube).m4a" type="audio/m4a">
    </audio>
    <p>infelizmente seu navegador não suporta a reprodução de audios</p>
</body>
</html>
