<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            position: relative;     
            /* todo container ja tem posição relativa */
            height: 500px;
            background-color: purple;
            padding: 10px;
            background-image: url(imagens/);
        }
        #conteudo {
           position: absolute;
           height: 200px;
           height: 200px;
           width: 400px;
           background-color: yellow;

           left: 100px;
           top: 150px;
           
        }
    </style>
</head>
<body>
    <section id="container"> 
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
