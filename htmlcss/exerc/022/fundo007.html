<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container {
            position: relative;     
            /* todo container ja tem posição relativa */
            height: 500px;
            background-color: purple;
            padding: 10px;
            background-image: url(imagens/);
        }
        #conteudo {
           position: absolute;
           /* a posiçao absoluta tem que estar atuva oara cnseguir centralizar */
           height: 300px;
           width: 300px;
           background-color: yellow;

           left: 50%;
           top: 50%;
           /* usar porcentagem para facilitar a ocupação */
           transform: translate(-50%, -50%);     
           /* o transform é para puxar o elemento para o centro, ou seja, metade da largura e metade da altura */    
        }
    </style>
</head>
<body>
    <section id="container"> 
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
