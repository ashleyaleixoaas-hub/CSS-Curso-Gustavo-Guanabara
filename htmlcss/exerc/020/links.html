<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Links</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
        }

        a
        {
            color: rgb(94, 3, 130);
        }

         a:visited
        {
            color: rgb(232, 0, 155);
        }

          a:hover
        {
            color: black;
            text-decoration: underline;
        }

        a:active
        {
            text-decoration: line-through;
            color: rgb(25, 7, 145);
        }

        a::after
        {
            content: " (link)";
            color: rgb(5, 37, 153);
        }

        .especial.especial::before
        {
            content: ">>";
            color: rgb(5, 37, 153);
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/ashleyaleixoaas-hub" class="especial">Repositorio GitHub</a></li>
        <li><a href="https://www.youtube.com/@Ashayaya">Canal do Youtube</a></li>
        <li><a href="https://gatinhosfofos.com.br/">Site Oficial</a></li>
    </ul>
</body>
</html>
