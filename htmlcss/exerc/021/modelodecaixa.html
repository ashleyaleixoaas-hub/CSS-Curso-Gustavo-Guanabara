<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1 {
            background-color: lightgray;
            border: 2px solid black;
            padding: 10px;
        }
        p {
            background-color: lightblue;
            border: 2px solid black;
            padding: 10px;
        }
        a {
            background-color: lightgreen;
            border: 2px solid black;
            padding: 5px;
            padding-top: 2px;
            padding-right: 2px;
            padding-bottom: 2px;
            padding-left: 2px;
        }
        </style>
</head>
<body>
    <h1>Exemplo de caixa box level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="">links são exemplos de box-inline</a>. vamos ver como funciona.</p>
</body>
</html>
